<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<form action="" method="post">
        <div>
        <label for="name">Name</label>
		<input id="name" type="text" placeholder="Name" required/>
        </div>
        <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Email" required/>
        </div>
		<label>Gender : </label>
		<div>
            <input id="gender_m" type="radio" name="gender" required/>
        <label for="gender_m">Male</label>
        </div>
		<div>
        <input id="gender_f" type="radio" name="gender" required/>
        <label for="gender_f">Female</label>
        </div>
        <div>
            <label for="cars">Select a car brand</label>
            <select id="cars" required>
            <option value="">--Please choose an option--</option>
            <option value="BMW">BMW</option>
            <option value="Audi">Audi</option>
            <option value="Ferrari">Ferrari</option>
        </select>
        </div>
        <div>
            <label for="age">Age</label>
            <input id="age" type="number" placeholder="Age" required/>
        </div>
        <div>
            <label for="dob">Date of birth</label>
            <input id="dob" type="date" required/>
        </div>
        <div>
            <label for="tel">Telephone</label>
            <input id="tel" type="tel" placeholder="xxx-xxx-xxxx" />
        </div>
       <div>
        <label for="password">Password</label>
         <input id="password" type="password" placeholder="Password" required/>
       </div>
        <div>
        <input id="tos" type="checkbox" required />
        <label for="tos">I agree to the TOS</label>
        </div>
        <button type="submit">Submit</button>
    </form>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
